name: QuSecure
description: QuSecure is a post-quantum cybersecurity company whose QuProtect R3 platform helps
  enterprises and government agencies discover, remediate, and report on cryptographic risk ahead of
  the quantum-computing threat. The platform pairs Recon (automated inventory of cryptographic assets),
  Resilience (crypto-agile remediation of encryption without code changes or downtime), and Reporting
  (Cryptographic Bill of Materials / CBOM for NIST, FIPS, CNSA 2.0, and GDPR compliance). QuSecure
  serves telecom, defense, finance, and critical-infrastructure customers including Fortune 500
  companies and U.S. federal agencies. This profile currently exposes no public developer API surface.
